- date: Sept 2026
  text: A collaborative study with Prof. Guozhao Fang, for which Ziqing served as corresponding author, was accepted for publication in <em>Nano Materials Science</em>.

- date: Aug 2026
  text: A collaborative study with Prof. Kent J. X. Zheng, for which Ziqing served as first author, was accepted for publication in <em>ACS Energy Letters</em>.

- date: Aug 2026
  text: Ziqing delivered four oral presentations and presented three posters at ACS Fall 2026.

- date: Aug 2026
  text: Ziqing joined Prof. A. Shoji Hall’s group at the University of Pennsylvania as a postdoctoral fellow.

- date: July 2026
  text: Ziqing successfully defended his doctoral dissertation and earned his Ph.D. in Analytical Chemistry from The University of Texas at Austin.

- date: July 2026
  text: Ziqing received special recognition from the Allen J. Bard Center for Electrochemistry for his contributions to the electrochemistry community at UT Austin.

- date: June 2026
  text: Ziqing’s first corresponding-author paper was accepted for publication in <em>Energy &amp; Environmental Science</em>.

- date: May 2026
  text: Ziqing received the ECS Battery Division Student Research Award in recognition of his doctoral research on batteries.

- date: May 2026
  text: Ziqing was selected to participate in the Next Generation Electrochemistry (NGenE) Workshop at Argonne National Laboratory.

- date: May 2026
  text: Ziqing was named one of the CAS Future Leaders Top 100.

- date: Feb 2026
  text: Ziqing was invited by Prof. Jeffrey E. Dick to present a seminar at Purdue University.

- date: Jan 2026
  text: Ziqing received the Graduate School Dissertation Writing Fellowship in support of his final semester at UT Austin.

- date: Jan 2026
  text: Ziqing presented his SECCM research at the Gordon Research Conference and Gordon Research Seminar on Electrochemistry.
